<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
    }

    .upper,
    .lower {
      height: 50%;
      width: 100%;
      display: flex;
    }

    .dark,
    .normal,
    .light {
      height: 100%;
      width: calc(100% / 3);
    }

    .red {
      .upper {
        .dark {
          background-color: rgb(147, 13, 40);
        }

        .normal {
          background-color: rgb(220, 20, 60);
        }

        .light {
          background-color: rgb(250, 50, 90);
        }
      }

      .lower {
        .dark {
          background-color: hwb(348 0 30);
        }

        .normal {
          background-color: hwb(348 10 15);
        }

        .light {
          background-color: hwb(348 20 0);
        }
      }
    }

    .blue {
      .upper {
        .dark {
          background-color: rgb(53, 13, 107);
        }

        .normal {
          background-color: rgb(80, 20, 160);
        }

        .light {
          background-color: rgb(110, 50, 190);
        }
      }

      .lower {
        .dark {
          background-color: hwb(266 0 55);
        }

        .normal {
          background-color: hwb(266 10 40);
        }

        .light {
          background-color: hwb(266 20 25);
        }
      }
    }

    .green {
      .upper {
        .dark {
          background-color: rgb(40, 67, 40);
        }

        .normal {
          background-color: rgb(60, 100, 60);
        }

        .light {
          background-color: rgb(90, 130, 90);
        }
      }

      .lower {
        .dark {
          background-color: hwb(120 10 75)
        }

        .normal {
          background-color: hwb(120 20 60)
        }

        .light {
          background-color: hwb(120 30 45)
        }
      }
    }

    .boring {
      .upper {
        .dark {
          background-color: #444;
        }

        .normal {
          background-color: #aaa;
        }

        .light {
          background-color: #fff;
        }
      }

      .lower {
        .dark {
          background-color: hwb(0 55 50)
        }

        .normal {
          background-color: hwb(0 65 35)
        }

        .light {
          background-color: hwb(0 75 20)
        }
      }
    }
  </style>
</head>

<body>
  <div class="upper">
    <div class="dark"></div>
    <div class="normal"></div>
    <div class="light"></div>
  </div>
  <div class="lower">
    <div class="dark"></div>
    <div class="normal"></div>
    <div class="light"></div>
  </div>
</body>

</html>
